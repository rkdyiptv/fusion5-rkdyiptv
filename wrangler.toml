# ============================================================
#  RKDYIPTV — Cloudflare Pages Configuration
#  File: /wrangler.toml  (project root)
# ============================================================

name = "rkdyiptv"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = "."

# ── Environment Variables (Default/Production) ──
[vars]
ENVIRONMENT = "production"
SITE_NAME = "RKDYIPTV"

# ── KV Namespace Binding (Default/Production) ──
# Ab sirf transient data ke liye: cooldown, ad-session, rate-limit, stats.
# Tokens + portals ab D1 mein hain (neeche).
[[kv_namespaces]]
binding = "TOKENS"
id = "fbe964428afb47a89198bb2f39269841"

# ── D1 Database Binding (Default/Production) ──
# Pehle create karo: wrangler d1 create rkdyiptv-db
# Fir yahan wahi database_id daalo jo command output mein milega.
[[d1_databases]]
binding = "DB"
database_name = "rkdyiptv-db"
database_id = "d1ca9d1a-a23c-48f1-9d26-7b3132cbc2af"

# ============================================================
#  PREVIEW ENVIRONMENT
# ============================================================
[env.preview.vars]
ENVIRONMENT = "preview"
SITE_NAME = "RKDYIPTV-Preview"

[[env.preview.kv_namespaces]]
binding = "TOKENS"
id = "fbe964428afb47a89198bb2f39269841"

[[env.preview.d1_databases]]
binding = "DB"
database_name = "rkdyiptv-db"
database_id = "d1ca9d1a-a23c-48f1-9d26-7b3132cbc2af"

# ============================================================
#  PRODUCTION ENVIRONMENT
# ============================================================
[env.production.vars]
ENVIRONMENT = "production"
SITE_NAME = "RKDYIPTV"

[[env.production.kv_namespaces]]
binding = "TOKENS"
id = "fbe964428afb47a89198bb2f39269841"

[[env.production.d1_databases]]
binding = "DB"
database_name = "rkdyiptv-db"
database_id = "d1ca9d1a-a23c-48f1-9d26-7b3132cbc2af"
